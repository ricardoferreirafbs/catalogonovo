server {
    listen 80;
    server_name catalogos.seudominio.com *.catalogos.seudominio.com;
    root /var/www/catalogo-saas/current/public;
    index index.php;

    client_max_body_size 8M;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
    }

    location ~ /\.(?!well-known).* { deny all; }
    location ~* \.(css|js|jpg|jpeg|png|webp|svg|woff2)$ { expires 30d; add_header Cache-Control "public, immutable"; }
}
