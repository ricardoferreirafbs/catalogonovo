[program:catalogo-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/catalogo-saas/current/artisan queue:work database --sleep=3 --tries=3 --timeout=120
directory=/var/www/catalogo-saas/current
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/www/catalogo-saas/current/storage/logs/worker.log
stopwaitsecs=3600
